spring:
  datasource:
    url: jdbc:h2:mem:rdamtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: test-secret-key-for-unit-tests-minimum-32-characters!!
  access-token-expiration: 3600
  refresh-token-expiration: 604800

rdam:
  mail:
    from: test@rdam.local
  certificado:
    validez-dias: 90
    storage-path: ./test-certs
  arancel:
    libre-deuda: 1500.00
  pluspagos:
    api-url: http://localhost:9999
    api-key: test-key
    api-secret: test-secret
    webhook-secret: test-webhook-secret

logging:
  level:
    ar.gob.rdam: DEBUG
    org.springframework.security: DEBUG
